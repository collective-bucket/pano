<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pano | Collective Bucket</title>
  <meta name="description" content="QR ile paylaşılabilir ilan panosu. İlanları görüntüle, oluştur ve indir." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="https://collectivebucket.com/assets/shell.css" />
</head>
<body>
  <header data-cb-shell="header">
    <div data-cb-shell-cta>
      <a class="btn btn-ghost" href="/mine">İlanlarım</a>
      <a class="btn btn-primary" id="new-ad" href="/edit">Yeni ilan</a>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="hero">
        <div>
          <h1>Pano</h1>
          <p>
            İlan hazırla, şablonunu seç, link ekle ve QR kod üret.
            Yayınlanan tüm ilanlar burada herkese açık listelenir.
          </p>
        </div>
        <div class="meta" id="home-status"></div>
      </section>
      <div id="ad-list" class="ad-grid"></div>
    </div>
  </main>

  <footer data-cb-shell="footer"></footer>

  <script src="https://collectivebucket.com/assets/shell.js" defer></script>
  <script src="https://auth.collectivebucket.com/client.js" defer></script>
  <script src="/assets/config.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script src="/assets/ads.js" defer></script>
  <script src="/assets/templates.js" defer></script>
  <script src="/assets/nav.js" defer></script>
  <script src="/assets/home.js" defer></script>
</body>
</html>
