<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İlanlarım | Pano</title>
  <meta name="description" content="Kendi Pano ilanlarını yönet." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="https://collectivebucket.com/assets/shell.css" />
</head>
<body>
  <header data-cb-shell="header">
    <div data-cb-shell-cta>
      <a class="btn btn-primary" href="/edit">Yeni ilan</a>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="hero">
        <div>
          <h1>İlanlarım</h1>
          <p>Oluşturduğun ilanlara tıklayarak düzenle.</p>
        </div>
        <div class="meta" id="mine-status"></div>
      </section>
      <div id="login-prompt" class="login-action" hidden>
        <a id="login-link" class="btn btn-primary" href="#">Giriş yap</a>
      </div>
      <div id="mine-list" class="ad-grid mine-grid"></div>
    </div>
  </main>

  <footer data-cb-shell="footer"></footer>

  <script src="https://collectivebucket.com/assets/shell.js" defer></script>
  <script src="https://auth.collectivebucket.com/client.js" defer></script>
  <script src="/assets/config.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script src="/assets/ads.js" defer></script>
  <script src="/assets/templates.js" defer></script>
  <script src="/assets/nav.js" defer></script>
  <script src="/assets/mine.js" defer></script>
</body>
</html>
