<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İlanlarım | Pano</title>
  <meta name="description" content="Kendi Pano ilanlarını yönet." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/">
        <img src="/assets/logo.svg" alt="" />
        <span>Pano</span>
      </a>
      <div class="nav-cta">
        <a class="btn btn-primary" href="/edit">Yeni ilan</a>
        <div class="cb-auth-controls" data-cb-auth></div>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="hero">
        <div>
          <h1>İlanlarım</h1>
          <p>Oluşturduğun ilanları düzenle, görüntüle veya sil.</p>
        </div>
        <div class="meta" id="mine-status"></div>
      </section>
      <div id="mine-list" class="ad-grid mine-grid"></div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <span>Collective Bucket · Pano</span>
      <a href="/">Tüm ilanlar</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js" defer></script>
  <script src="https://auth.collectivebucket.com/client.js" defer></script>
  <script src="/assets/config.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script src="/assets/ads.js" defer></script>
  <script src="/assets/templates.js" defer></script>
  <script src="/assets/mine.js" defer></script>
</body>
</html>
