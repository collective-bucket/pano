<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İlan düzenle | Pano</title>
  <meta name="description" content="Pano ilanı oluştur veya düzenle." />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="https://collectivebucket.com/assets/shell.css" />
</head>
<body>
  <header data-cb-shell="header">
    <div data-cb-shell-cta>
      <a class="btn btn-ghost" href="/mine">İlanlarım</a>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="hero">
        <div>
          <h1>İlan düzenle</h1>
          <p>Şablon seç, metni ve linkleri ayarla, kaydettikten sonra QR kodunu indir.</p>
        </div>
      </section>

      <div id="login-prompt" class="login-action" hidden>
        <a id="login-link" class="btn btn-primary" href="#">Giriş yap</a>
      </div>

      <div id="editor" class="edit-layout" hidden>
        <dialog id="edit-dialog" class="modal edit-modal" open>
          <form id="edit-form" class="modal-form">
            <div class="modal-header">
              <h2>İçerik</h2>
            </div>
            <div class="modal-content">
              <input id="ad-id" type="hidden" />

              <label for="title">Başlık</label>
              <input id="title" name="title" type="text" maxlength="120" required />

              <label for="body">Açıklama</label>
              <textarea id="body" name="body" maxlength="2000"></textarea>

              <fieldset class="color-fieldset">
                <legend>Post-it rengi</legend>
                <div class="color-options">
                  <label class="color-option color-yellow">
                    <input type="radio" name="noteColor" value="yellow" checked />
                    <span>Sarı</span>
                  </label>
                  <label class="color-option color-mint">
                    <input type="radio" name="noteColor" value="mint" />
                    <span>Mint</span>
                  </label>
                  <label class="color-option color-pink">
                    <input type="radio" name="noteColor" value="pink" />
                    <span>Pembe</span>
                  </label>
                  <label class="color-option color-blue">
                    <input type="radio" name="noteColor" value="blue" />
                    <span>Mavi</span>
                  </label>
                  <label class="color-option color-lilac">
                    <input type="radio" name="noteColor" value="lilac" />
                    <span>Lila</span>
                  </label>
                </div>
              </fieldset>

              <label>Linkler</label>
              <div id="links-list"></div>
              <button id="add-link" class="btn btn-ghost" type="button">Link ekle</button>

              <label class="check">
                <input id="published" name="published" type="checkbox" checked />
                Yayında göster
              </label>
              <p id="edit-message" class="message" role="status"></p>
            </div>
            <div class="modal-actions">
              <button id="delete-ad" class="btn btn-ghost danger" type="button" hidden>Sil</button>
              <a class="btn btn-ghost" href="/mine">Vazgeç</a>
              <button class="btn btn-primary" type="submit">Kaydet</button>
            </div>
          </form>
        </dialog>

        <div class="preview-column">
          <aside class="panel">
            <h2>Önizleme</h2>
            <div id="preview"></div>
          </aside>
          <aside id="qr-panel" class="panel qr-panel" hidden>
            <h2>QR kod</h2>
            <img id="qr-image" alt="İlanın QR kodu" />
            <a id="qr-public-url" class="qr-public-url" target="_blank" rel="noopener"></a>
            <div class="actions" style="justify-content:center;">
              <a id="qr-download" class="btn btn-primary" href="#">QR görselini indir</a>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </main>

  <dialog id="confirm-dialog" class="modal">
    <div class="modal-body">
      <div class="modal-header">
        <h2>Silinsin mi?</h2>
        <button class="btn btn-ghost btn-icon" type="button" data-close-dialog aria-label="Kapat" title="Kapat">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-content">
        <p class="modal-text">Bu ilan kalıcı olarak kaldırılacak.</p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" type="button" data-close-dialog>Vazgeç</button>
        <button id="confirm-delete" class="btn btn-danger-fill" type="button">Sil</button>
      </div>
    </div>
  </dialog>

  <footer data-cb-shell="footer"></footer>

  <script type="module" src="/assets/qr.js"></script>
  <script src="https://collectivebucket.com/assets/shell.js" defer></script>
  <script src="https://auth.collectivebucket.com/client.js" defer></script>
  <script src="/assets/config.js" defer></script>
  <script src="/assets/firestore.js" defer></script>
  <script src="/assets/ads.js" defer></script>
  <script src="/assets/templates.js" defer></script>
  <script src="/assets/nav.js" defer></script>
  <script src="/assets/edit.js" defer></script>
</body>
</html>
